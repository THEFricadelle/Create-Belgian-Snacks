name: Build

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Also validates gradle-wrapper.jar against the published Gradle checksums.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Compiles and runs the JUnit suite.
      - run: ./gradlew build --no-daemon

      # Exits non-zero when a required GameTest fails.
      - run: ./gradlew runGameTestServer --no-daemon

      # Generated resources must match what datagen produces: catches hand edits and forgotten runData.
      - run: ./gradlew runData --no-daemon
      - name: Check generated resources are up to date
        run: |
          git diff --exit-code -- src/generated
          test -z "$(git status --porcelain -- src/generated)"
