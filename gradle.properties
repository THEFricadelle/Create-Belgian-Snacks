org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mod
# mod_id must match ^[a-z][a-z0-9_]{1,63}$ (FML ModInfo); mod_slug is only used for file names.
mod_id=create_belgian_snacks
mod_slug=create-belgian-snacks
mod_name=Create: Belgian Snacks
mod_license=All Rights Reserved
mod_version=0.0.9
mod_group_id=be.thefricadelle.belgiansnacks
mod_authors=THEFricadelle
mod_description=Belgian fricadelles, industrialised with Create.

# Minecraft / NeoForge (aligned on the Arcadia V2 2.0.32 manifest)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
neo_version_range=[21.1,)
loader_version_range=[4,)

# Mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Create stack. 6.0.10-280 is the build whose Git-Hash matches the jar shipped in Arcadia.
# Ponder, Flywheel and Registrate are the versions Create 6.0.10 embeds.
create_version=6.0.10-280
create_version_range=[6.0.10,6.1.0)
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# Compat (Arcadia versions)
jei_version=19.57.0.447
jade_version=15.10.6

# Compat GameTests only (Arcadia 2.0.32 version)
farmers_delight_version=1.21.1-1.3.4
